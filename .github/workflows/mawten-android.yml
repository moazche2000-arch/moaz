name: Build Mawten Android
on:
  push:
    paths:
      - 'mawten/android/**'
      - '.github/workflows/mawten-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mawten-android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Preserve existing signing identity
        run: |
          if test -f mawten/android-dist/signing-backup.encrypted.json; then
            echo 'A release signing key already exists. Reuse the preserved private key for updates; never generate a replacement.'
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate private release signing identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {randomBytes} from 'node:crypto';
          import {appendFileSync} from 'node:fs';
          const password=randomBytes(24).toString('hex');
          console.log('::add-mask::'+password);
          appendFileSync(process.env.GITHUB_ENV,'MAWTEN_SIGNING_PASSWORD='+password+'\nMAWTEN_SIGNING_STORE='+process.env.RUNNER_TEMP+'/mawten-release.p12\n');
          NODE
      - name: Create release key
        run: keytool -genkeypair -storetype PKCS12 -keystore "$MAWTEN_SIGNING_STORE" -storepass:env MAWTEN_SIGNING_PASSWORD -keypass:env MAWTEN_SIGNING_PASSWORD -alias mawten -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Mawten Colony, O=Mawten"
      - name: Build signed Android application
        working-directory: mawten/android
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify Android signatures and export public certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs mawten/android/app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/signature-report.txt"
          cat "$RUNNER_TEMP/signature-report.txt"
          keytool -exportcert -keystore "$MAWTEN_SIGNING_STORE" -storepass:env MAWTEN_SIGNING_PASSWORD -alias mawten -file "$RUNNER_TEMP/mawten-cert.der"
          node mawten/android/finish-build.mjs
      - name: Publish installable APK and encrypted signing backup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mawten/android-dist
          git commit -m 'Publish signed Mawten Android APK and encrypted signing backup'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/mawten-release.p12" "$RUNNER_TEMP/mawten-cert.der"
